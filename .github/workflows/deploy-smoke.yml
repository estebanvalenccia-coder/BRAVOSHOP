name: BravoShop production readiness
on:
  push:
    branches: [develop]
concurrency:
  group: bravoshop-production-readiness
  cancel-in-progress: true
jobs:
  wait-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for production readiness
        run: |
          for i in {1..60}; do
            code=$(curl -sS -o /tmp/ready.json -w "%{http_code}" https://api.bravoshop.online/api/ready || true)
            commit=$(node -e 'const fs=require("fs");try{process.stdout.write(JSON.parse(fs.readFileSync("/tmp/ready.json","utf8")).commit||"")}catch{}' )
            if [ "$code" = "200" ] && [ "$commit" = "$GITHUB_SHA" ]; then cat /tmp/ready.json; exit 0; fi
            sleep 10
          done
          cat /tmp/ready.json || true
          exit 1
      - name: Run non-destructive production checks
        env:
          SMOKE_API_URL: https://api.bravoshop.online
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: node scripts/postdeploy-check.js
